{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  PeoTaxo Page
  <ul>
    {{ range $term, $taxonomy := .Site.Taxonomies.positions }}
      <li>{{ $term }}</li>
      <ul>
        {{ range $taxonomy.Pages.ByLinkTitle }}
          <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
      </ul>
    {{ end }}
  </ul>
{{ end }}
