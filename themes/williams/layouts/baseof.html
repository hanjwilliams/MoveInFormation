<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
  {{ block "custom" . }}{{end}}
</head>
<body>
  {{/*  <div class="parallax-header"></div>  */}}
  <div class="parallax">
  {{ block "banner" . }}
  {{ partial "threebanner.html" . }}
  {{ end }}
  <div class="container">
  <header>
    {{ partial "header.html" . }}
  </header>
  <div class="content">
  <main>
    {{ block "main" . }}{{ end }}
  </main>
    {{ block "sidebar" . }}{{ end }}
  </div>
  <footer>
    {{ partial "footer.html" . }}
  </footer>
  </div>
  </div>
  <script type="text/javascript" src="{{ "/js/navigation.js" | relURL }}"></script>
    <script type="text/javascript" src="{{ "/js/video.js" | relURL }}"></script>
</body>
</html>
